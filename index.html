</head>

  <body>
    <style>
      #initial-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#fffaf0;z-index:9999;font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,sans-serif;transition:opacity .35s ease}
      #initial-loader.fade-out{opacity:0;pointer-events:none}
      .il-logo{display:flex;align-items:center;gap:12px}
      .il-badge{width:64px;height:64px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 24px rgba(245,158,11,.35);animation:il-pop .9s ease infinite alternate}
      .il-badge img{width:100%;height:100%;object-fit:contain}
      .il-text{display:flex;flex-direction:column;line-height:1}
      .il-name{font-family:'Dancing Script',cursive;font-size:34px;font-weight:700;color:#b45309}
      .il-tag{font-size:11px;letter-spacing:.12em;color:#92400e;margin-top:4px}
      .il-bar{width:200px;height:4px;border-radius:999px;background:rgba(245,158,11,.18);overflow:hidden}
      .il-bar-fill{width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#f59e0b,#fbbf24);animation:il-slide 1.1s ease-in-out infinite}
      .il-msg{font-size:13px;color:#92400e;font-weight:500;letter-spacing:.02em}
      .il-msg .dot{display:inline-block;animation:il-blink 1.4s infinite both}
      .il-msg .dot:nth-child(2){animation-delay:.2s}
      .il-msg .dot:nth-child(3){animation-delay:.4s}
      @keyframes il-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
      @keyframes il-pop{from{transform:scale(1)}to{transform:scale(1.06)}}
      @keyframes il-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    </style>
    <div id="root">
      <div id="initial-loader">
        <div class="il-logo">
          <div class="il-badge">
            <img src="/brand-logo.png" alt="Surzo Shop logo" />
          </div>
          <div class="il-text">
            <span class="il-name">Surzo Shop</span>
            <span class="il-tag">সেরা পণ্য, সেরা দামে</span>
          </div>
        </div>
        <div class="il-bar"><div class="il-bar-fill"></div></div>
        <div class="il-msg">লোড হচ্ছে<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
